apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: claims

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: claims-intake
      app.kubernetes.io/part-of: claims-platform

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - dispatcher-deployment.yaml
  - console-deployment.yaml
  - console-service.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml
  - hpa.yaml

images:
  - name: claims-intake-api
    newTag: latest
  - name: claims-console
    newTag: latest
