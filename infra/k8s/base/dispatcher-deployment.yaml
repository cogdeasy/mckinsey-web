apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-outbox-dispatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: outbox-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/component: outbox-dispatcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      serviceAccountName: claims-intake
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: claims-intake-api
          command: ["python", "-m", "claims_intake.outbox_dispatcher"]
          ports:
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: claims-intake-config
            - secretRef:
                name: claims-intake-runtime
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
