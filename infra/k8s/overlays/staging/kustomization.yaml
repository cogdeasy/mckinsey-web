apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: claims-staging
nameSuffix: -staging

resources:
  - ../../base
  - externalsecret.yaml

patches:
  - path: replicas.yaml
  - path: ingress.yaml

configMapGenerator:
  - name: claims-intake-config
    behavior: merge
    literals:
      - CLAIMS_ENVIRONMENT=staging
      - CLAIMS_LOG_LEVEL=INFO
      - CLAIMS_JWT_ISSUER=https://id.staging.meridian-assurance.example/
      - CLAIMS_DOCUMENTS_BUCKET=claims-staging-claim-documents

images:
  - name: claims-intake-api
    newName: 000000000000.dkr.ecr.eu-west-2.amazonaws.com/claims-intake-api
    newTag: staging
  - name: claims-console
    newName: 000000000000.dkr.ecr.eu-west-2.amazonaws.com/claims-console
    newTag: staging
