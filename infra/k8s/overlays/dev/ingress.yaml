apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claims
spec:
  rules:
    - host: claims.dev.meridian-assurance.example
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: claims-intake-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claims-console
                port:
                  name: http
