apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: claims-intake-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: claims-intake-runtime
    creationPolicy: Owner
  data:
    - secretKey: CLAIMS_DATABASE_URL
      remoteRef:
        key: claims-dev/database-url
    - secretKey: CLAIMS_JWT_SECRET
      remoteRef:
        key: claims-dev/oidc-signing-key
