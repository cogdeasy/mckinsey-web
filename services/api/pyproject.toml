[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-intake-service"
version = "1.2.0"
description = "Claims intake and servicing API for Meridian Assurance personal lines"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claims_intake = ["rules/*.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE", "DTZ", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "S101"]
# Module level caches that are intentionally process wide.
"src/claims_intake/db.py" = ["PLW0603"]
"src/claims_intake/observability/tracing.py" = ["PLW0603"]
"src/claims_intake/outbox_dispatcher.py" = ["PLW0603"]
# The comparison operator table reads better as a flat sequence of guards.
"src/claims_intake/domain/rules.py" = ["PLR0911"]
"alembic/*" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = "alembic/"

[[tool.mypy.overrides]]
module = ["botocore.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a PostgreSQL database",
    "contract: asserts the published API contract",
]
filterwarnings = ["error::DeprecationWarning:claims_intake.*"]
