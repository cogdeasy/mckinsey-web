name: claims-intake

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-claims-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-claims-local-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://objectstore:9000 ${AWS_ACCESS_KEY_ID:-claims-local} ${AWS_SECRET_ACCESS_KEY:-claims-local-secret} &&
      mc mb --ignore-existing local/meridian-claim-documents &&
      mc anonymous set none local/meridian-claim-documents
      "

  mail:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: ./services/api
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    environment:
      CLAIMS_ENVIRONMENT: local
      CLAIMS_DATABASE_URL: postgresql+psycopg://claims:claims@postgres:5432/claims
      CLAIMS_AUTH_DISABLED: "true"
      CLAIMS_S3_ENDPOINT_URL: http://objectstore:9000
      CLAIMS_DOCUMENTS_BUCKET: meridian-claim-documents
      CLAIMS_LOG_LEVEL: INFO
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-claims-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-claims-local-secret}
      AWS_DEFAULT_REGION: eu-west-2
    command: >
      sh -c "alembic upgrade head &&
      uvicorn claims_intake.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox-dispatcher:
    build:
      context: ./services/api
    depends_on:
      api:
        condition: service_healthy
    environment:
      CLAIMS_ENVIRONMENT: local
      CLAIMS_DATABASE_URL: postgresql+psycopg://claims:claims@postgres:5432/claims
      CLAIMS_LOG_LEVEL: INFO
    command: ["python", "-m", "claims_intake.outbox_dispatcher"]

  console:
    build:
      context: ./apps/console
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-5173}:8080"

volumes:
  postgres-data:
  objectstore-data:
